<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Haven MaterialX Materials</title>
    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/kwokcb/materialxMaterials/refs/heads/main/documents/images/download.png">
    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* Resizable modal CSS */
        /* .modal.show {
            display: block !important;
            align-items: unset !important;
        }
        .modal-dialog {
            width: auto !important;
            height: auto !important;
            display: block !important;
        }
        .resizable-modal-content {
            resize: both;
            overflow: auto;
            min-width: 400px;
            min-height: 200px;
            max-width: 90vw;
            max-height: 90vh;
        } */
        .material-card {
            transition: transform 0.2s;
            cursor: pointer;
            height: 100%;
        }

        .material-card:hover {
            transform: scale(1.03);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }

        .material-img {
            height: 180px;
            object-fit: cover;
        }

        .loading-spinner {
            display: none;
        }

        .category-badge {
            margin-right: 5px;
            margin-bottom: 5px;
        }

        #materialPreview {
            max-height: 480px;
            object-fit: cover;
        }

        .map-badge {
            font-size: 0.8rem;
        }

        /* Bootstrap icon spin animation */
        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.3/umd/index.min.js"></script> -->  
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
    <!-- Code mirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img class="px-1"
                    src="https://raw.githubusercontent.com/kwokcb/materialxMaterials/refs/heads/main/documents/images/download.png"
                    loading="lazy" decoding="async"
                    width="48px" alt="MaterialX Materials Icon">
                <span class="ms-2">Poly Haven MaterialX Materials</span>
            </a>
            <!-- <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button> -->
            <div class="d-flex align-items-center ms-auto">
                <button id="themeToggleBtn" class="btn btn-outline-light btn-sm ms-2" type="button"
                    title="Toggle dark/light mode">
                    <span id="themeIcon" class="bi bi-moon"></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">

                <div class="row g-3 align-items-center mb-2">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search materials...">
                            <button class="btn btn-sm btn-primary" id="searchButton">Search</button>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select form-select-sm" id="categoryFilter">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="resolutionFilter">
                            <option value="1k" selected>1K Images</option>
                            <option value="2k">2K Images</option>
                            <option value="4k">4K Images</option>
                            <option value="8k">8K Images</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-center">
                    <div class="spinner-border loading-spinner text-primary" role="status" id="mainSpinner">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" id="materialsContainer" style="height: 512px; overflow-y: auto;">
            <!-- Materials will be loaded here -->
        </div>
    </div>

    <!-- Material Preview Modal -->
    <div class="modal fade" id="materialModal" tabindex="-1" aria-labelledby="materialModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" id="materialModalDialog">
            <div class="modal-content resizable-modal-content">
                <div class="modal-header" id="materialModalHeader">
                    <h5 class="modal-title" id="materialModalLabel">Material Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="font-size: 11px">
                    <div class="row">
                        <div class="col-md">
                            <img src="" alt="Material Preview" class="img-fluid rounded mb-2" id="materialPreview" loading="lazy" decoding="async">
                            <div id="materialTags" class="mb-2"></div>
                            <div id="materialCategories" class="mb-2"></div>
                        </div>
                        <div class="col-md-7">
                            <p id="materialDescription"></p>
                            <div class="mb-2">
                                <label for="materialResolution" class="form-label">Image Resolution</label>
                                <select class="form-select form-select-sm" id="materialResolution"                                    >
                                    <option value="1k" selected>1K</option>
                                    <option value="2k">2K </option>
                                    <option value="4k">4K</option>
                                    <option value="8k">8K</option>
                                </select>
                            </div>
                            <div class="mb-2">
                                <label class="form-label" style="display: none;">Maps Available</label>
                                <div id="materialMaps" class="d-flex flex-wrap gap-2"></div>
                            </div>
                            <div class="d-grid gap-1">
                                <button style="font-size: 11px;" class="btn btn-sm btn-primary" id="downloadMaterial">
                                    <i class="bi bi-download me-2"></i>Download Material
                                </button>
                                <button style="font-size: 11px;" class="btn btn-sm btn-primary" id="copyMaterialLink">
                                    <i class="bi bi-link me-2"></i>Copy Material Link
                                </button>
                                <button style="font-size: 11px;" class="btn btn-sm btn-primary" id="previewMaterial">
                                    <i class="bi bi-eye me-2"></i>Preview
                                </button>
                                <div class="row-sm p-0 m-0 g-0">
                                    <!-- Viewer -->
                                    <div class="col-sm p-0 m-0 g-0">
                                    <div class="container-fluid p-0 m-0 g-0" id="viewerContainer">
                                        <iframe id="viewer" src="" class="p-0"
                                            style="width: 100%; height: 480px; overflow: auto; border: none; display:none;"
                                            frameborder="0" allowfullscreen>
                                        </iframe>
                                    </div>
                                    </div>
                                </div>                            
                            </div>
                        </div>
                        <div class="text-center py-1">
                            <button style="font-size: 11px;" class="btn btn-primary" id="loadContentBtn">
                                <i class="bi bi-eye me-2"></i>Show Content
                            </button>
                        </div>
                        <div id="contentPreview" class="container mt-1" style="display:none;">
                            <div class="mt-2 mb-2">
                                <b>Textures</b>
                                <div id="textureGallery" class="row g-2"></div>
                            </div>
                            <textarea id="mtlxEditor"></textarea>
                        </div>
                        <!-- <textarea id="mtlxEditor" style="display:none;"></textarea> -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" style="font-size: 11px" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap and loader -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="jsPolyHavenLoader.js"></script>
    <script src="main.js"></script>

</body>

</html>
